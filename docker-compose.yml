services:
  mongodb:
    image: mongo:7.0
    container_name: teamlogger-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: teamlogger
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: teamlogger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: rustfs/rustfs:latest
    container_name: teamlogger-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    command: --address :9000 --console-enable /data
    volumes:
      - s3_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  s3_data:
